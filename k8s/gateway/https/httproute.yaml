apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inventory-api
  namespace: 5stack
spec:
  parentRefs:
    - name: inventory
      sectionName: https
  hostnames:
    - ${INVENTORY_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: inventory-backend
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inventory-frontend
  namespace: 5stack
spec:
  parentRefs:
    - name: inventory
      sectionName: https
  hostnames:
    - ${INVENTORY_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: inventory-frontend
          port: 80
