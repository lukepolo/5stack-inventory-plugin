# The DEV backend: this fork's backend, beside the installed plugin's, for the
# GitHub Pages dev copy (docs/DEV-PLUGIN.md). Applied by scripts/dev-backend.sh,
# which fills in __IMAGE__ — not by plugin.sh or custom.sh, which never read this
# directory.
#
# Every name is inventory-dev-*, so nothing here can replace a resource the
# installed plugin owns. What it SHARES with it, on purpose:
#   - the database (inventory-dev-secrets holds a copy of the live DATABASE_URL),
#     so the dev copy shows real inventories and what it equips reaches the game
#     servers through the live backend's feed;
#   - the node and its two hostPaths (models mount, CS2 install), so extraction
#     run from here lands where the live frontend serves models from.
# What it does NOT share: the card store. RENDERS_DIR points at a folder of its
# own, so cards baked under BAKE_ENVIRONMENT never mix with the live ones.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: inventory-dev-backend
  name: inventory-dev-backend
  namespace: 5stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-dev-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: inventory-dev-backend
    spec:
      # The node install labeled for the live plugin — its hostPaths are local.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: 5stack-inventory
                    operator: In
                    values:
                      - "true"
      volumes:
        - name: cs2-models
          hostPath:
            path: /opt/5stack/models/cs2-model-extract
            type: DirectoryOrCreate
        - name: cs2-game
          hostPath:
            path: /opt/5stack/serverfiles
            type: Directory
      containers:
        - name: inventory-dev-backend
          image: __IMAGE__
          imagePullPolicy: Always
          volumeMounts:
            - name: cs2-models
              mountPath: /cs2-models
            - name: cs2-game
              mountPath: /cs2-game
              readOnly: true
          # WEB_DOMAIN / AUTH_COOKIE_DOMAIN copied from the live config, plus
          # this backend's own INVENTORY_DOMAIN — see scripts/dev-backend.sh.
          envFrom:
            - configMapRef:
                name: inventory-dev-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-dev-secrets
                  key: DATABASE_URL
            - name: CS2_DIR
              value: /cs2-game
            - name: EXTRACT_WORK_DIR
              value: /cs2-models/.work
            # Its own card store — the reason a dev bake can be lit differently.
            - name: RENDERS_DIR
              value: /cs2-models/renders-dev
            - name: BAKE_ENVIRONMENT
              value: cs2
            # The live backend extracts on its own schedule; two of them racing
            # over one mount is the one thing a shared mount must never do.
            # Extraction from here is by hand only (⚙ settings → 3D Models).
            - name: INVENTORY_AUTO_EXTRACT
              value: "0"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
          ports:
            - containerPort: 3000
              name: http
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-dev-backend
  namespace: 5stack
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: inventory-dev-backend
