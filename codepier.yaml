# Hot-swap EITHER container in-cluster for live dev. `workload` lists both, so
# `codepier up` lets you pick inventory-backend or inventory-frontend (or pass
# --deployment <name>). Everything runs behind the real ingress: forward-auth
# identity, same-origin /api, no env vars, no CORS to configure.
#
#   Frontend:  codepier up --deployment inventory-frontend
#              codepier ssh   ->   yarn dev:ui     (build --watch + serve on :80)
#
#   Backend:   codepier up --deployment inventory-backend
#              codepier ssh   ->   yarn dev:api    (node --watch hot reload)
namespaces: [5stack]
image: node:22
workload:
  - inventory-backend
  - inventory-frontend
workdir: /app
sync:
  - .:/app
ignore:
  - "/node_modules"
  - "/dist"
  - "/backend/node_modules"
  # extract-models.sh's work dir, and it is 5.5GB: the Source2Viewer CLI plus
  # every decompiled intermediate (raw, raw_att, raw_ci, raw_items). Pod-side
  # build output that has no business crossing the boundary — exactly the case
  # `ignore` exists for. Without this entry a single extraction run mirrors the
  # whole thing onto the local machine, and a local cleanup then deletes the
  # pod's copy too, forcing the next run to re-extract cold.
  - "/cs2-model-extract"
  # Its tarball output, same reasoning.
  - "/cs2-models-glb.tar.gz"
