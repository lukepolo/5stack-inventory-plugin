# The DEV backend's image: this fork's backend, published as
# ghcr.io/<owner>/5stack-inventory-plugin-backend:dev for scripts/dev-backend.sh
# to run beside the installed plugin. See docs/DEV-PLUGIN.md.
#
# Separate from upstream's `ci` workflow (disabled in the fork) on purpose: that
# one pushes :latest of both images, which is what a real install pulls. This
# pushes only the backend, and only under :dev, so nothing an installed plugin
# runs can be replaced by a push here.
name: dev-backend

on:
  push:
    branches:
      - "main"
    paths:
      - "backend/**"
      - "scripts/**"
      - "tools/nmclip.mjs"
      - "tools/nmclip-data.mjs"
      - "tools/dmx.mjs"
      - "Dockerfile.backend"
      - ".github/workflows/dev-backend.yml"
  workflow_dispatch:

concurrency:
  group: dev-backend
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Registry paths must be lowercase; an owner like "LCrew" is not.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/5stack-inventory-plugin-backend" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures, like upstream: the node the plugin is pinned to is
      # whichever machine hosts the game servers, and that is not always amd64.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-dev
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-dev,mode=max
          tags: |
            ${{ steps.image.outputs.name }}:dev
            ${{ steps.image.outputs.name }}:dev-${{ github.sha }}
